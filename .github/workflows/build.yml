name: Build AuriBuds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project AuriBuds.xcodeproj \
            -scheme AuriBuds \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p build/artifacts
          cp -R build/DerivedData/Build/Products/Release/AuriBuds.app build/artifacts/AuriBuds.app
          ditto -c -k --keepParent build/artifacts/AuriBuds.app build/artifacts/AuriBuds.app.zip

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          set -euo pipefail
          create-dmg \
            --volname "AuriBuds" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AuriBuds.app" 175 190 \
            --hide-extension "AuriBuds.app" \
            --app-drop-link 425 190 \
            "build/artifacts/AuriBuds.dmg" \
            "build/artifacts/AuriBuds.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuriBuds-macOS
          path: |
            build/artifacts/AuriBuds.app
            build/artifacts/AuriBuds.app.zip
            build/artifacts/AuriBuds.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/artifacts/AuriBuds.app.zip
            build/artifacts/AuriBuds.dmg
